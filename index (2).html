<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ghifariyadi: education and work experience, as a ride.">
<meta name="theme-color" content="#00AA13">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ghifariyadi Ride</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: ride-hailing app — booking rail left, schematic map right; on phones, full-bleed map + draggable bottom sheet */
:root{
  --bg:#ffffff; --surface:#ffffff; --sunk:#f3f4f3; --line:#e6e8e6;
  --ink:#0b0d0c; --ink-2:#5e6460; --ink-3:#8f9591;
  --green:#00AA13; --green-ink:#00880f; --green-wash:#e7f6e8;
  --map:#eef0ee; --block:#e2e5e2; --road:#ffffff; --road-major:#ffffff; --water:#d6e4ea; --park:#d9ecd9; --map-label:#7c837e;
  --shadow:0 1px 2px rgba(10,20,12,.06),0 8px 24px rgba(10,20,12,.10);
  --f:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-sm:14px; --r:16px; --r-lg:22px; --dest:#E8352B;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0e0d; --surface:#151817; --sunk:#1d211f; --line:#272b29;
  --ink:#f2f4f3; --ink-2:#a3aaa6; --ink-3:#6f7672;
  --green:#18c22b; --green-ink:#3ad64b; --green-wash:#11301a;
  --map:#121513; --block:#1a1e1c; --road:#262b28; --road-major:#30362f; --water:#132029; --park:#14261a; --map-label:#6b736e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0e0d; --surface:#151817; --sunk:#1d211f; --line:#272b29;
  --ink:#f2f4f3; --ink-2:#a3aaa6; --ink-3:#6f7672;
  --green:#18c22b; --green-ink:#3ad64b; --green-wash:#11301a;
  --map:#121513; --block:#1a1e1c; --road:#262b28; --road-major:#30362f; --water:#132029; --park:#14261a; --map-label:#6b736e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}

.stage{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--sunk)}
.bar{display:flex;align-items:center;justify-content:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{height:30px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-2);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.holder{min-height:0;display:grid;place-items:center;overflow:hidden}
.frame{container:app/size;width:100%;height:100%;overflow:hidden;position:relative;transition:width .35s,height .35s,border-radius .35s}
.stage.appmode .holder{padding:16px}
.stage.appmode .frame{width:390px;max-width:100%;height:min(820px,100%);border-radius:40px;border:10px solid #0b0d0c;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.app{display:grid;grid-template-columns:400px 1fr;grid-template-rows:minmax(0,1fr);height:100%}

/* ---------- rail ---------- */
.rail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface);min-width:0;z-index:2}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--green);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand i{width:10px;height:10px;border-radius:50%;background:#fff;display:block}
.avatar{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--green-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.sheet-body{flex:1;min-height:0;padding:20px 24px 24px;display:flex;flex-direction:column;gap:20px;overflow:auto}
.greet{display:flex;flex-direction:column;gap:2px}
.greet small{color:var(--ink-2);font-size:14px}
.greet h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}

.trip{background:var(--sunk);border-radius:var(--r);padding:6px;display:grid;grid-template-columns:28px 1fr;align-items:center}
.trip .rail-ico{grid-row:1/3;display:flex;flex-direction:column;align-items:center;gap:4px;padding-block:14px}
.trip .rail-ico span{display:block}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
.stem{width:2px;height:26px;background:var(--ink-3);opacity:.5}
.sq{width:9px;height:9px;border-radius:50%;background:var(--dest)}
.trip .row{padding:10px 10px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;gap:8px;min-width:0}
.trip .row + .row{border-top:1px solid var(--line)}
.trip .row em{font-style:normal;color:var(--ink-3);font-weight:500;font-size:13px}
.trip .row .val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.dests{display:flex;flex-direction:column;gap:6px}
.dest{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;text-align:left;padding:12px;border-radius:var(--r);border:1.5px solid transparent;transition:background .15s,border-color .15s,transform .1s}
.dest:hover{background:var(--sunk)}
.dest:active{transform:scale(.985)}
.dest[aria-checked="true"]{border-color:var(--green);background:var(--green-wash)}
.dest .ico{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;transition:background .2s,color .2s}
.ico img,.logo img{width:78%;height:78%;object-fit:contain;display:block}
.dest .t{font-weight:700;font-size:16px;letter-spacing:-.01em}
.dest .s{color:var(--ink-2);font-size:13.5px;margin-top:1px}
.dest .yr{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}

.cta{margin-top:auto;padding:16px 24px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.btn{height:52px;border-radius:999px;background:var(--green);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,opacity .15s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.985)}
.fine{font-size:12px;color:var(--ink-3);text-align:center}

/* ---------- map ---------- */
.map{position:relative;background:var(--map);overflow:hidden;min-width:0}
.map > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.blk{fill:var(--block)}
.park{fill:var(--park)}
.water{fill:var(--water)}
.road{stroke:var(--road);stroke-width:9;fill:none;stroke-linecap:round}
.road.major{stroke:var(--road-major);stroke-width:16}
.mlab{fill:var(--map-label);font:600 11px var(--f);letter-spacing:.12em;text-transform:uppercase}
.route-casing{stroke:var(--green);stroke-width:9;fill:none;stroke-linejoin:round;stroke-linecap:round;opacity:.12}
.route{stroke:var(--green);stroke-width:6;fill:none;stroke-linejoin:round;stroke-linecap:round}
.ghost{stroke:var(--ink-3);stroke-width:5;fill:none;stroke-linejoin:round;stroke-linecap:round;opacity:.35}
.pin-o circle.outer{fill:var(--surface);stroke:var(--green);stroke-width:5}
.pin-o circle.inner{fill:var(--green)}
.pin-d rect.outer{fill:var(--dest)}
.pin-d rect.inner{fill:var(--surface)}
.pin-alt circle{fill:var(--surface);stroke:var(--ink-3);stroke-width:3}
.tag rect{fill:var(--surface);filter:drop-shadow(0 2px 6px rgba(0,0,0,.15))}
.tag text{fill:var(--ink);font:700 13px var(--f)}
.tag text.sub{fill:var(--ink-2);font:500 11px var(--f)}
.tag .eta{fill:var(--ink)}
.tag .eta-t{fill:var(--bg);font:700 11px var(--mono)}
.car{fill:var(--ink);stroke:var(--surface);stroke-width:3}

.controls{position:absolute;right:20px;top:20px;display:flex;flex-direction:column;gap:10px;z-index:3}
.ctrl-group{background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.ctrl{width:44px;height:44px;display:grid;place-items:center;transition:background .15s}
.ctrl:hover{background:var(--sunk)}
.ctrl-group .ctrl + .ctrl{border-top:1px solid var(--line)}
.ctrl-solo{border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--shadow)}
.legend{position:absolute;left:20px;top:20px;z-index:3;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.legend b{width:6px;height:6px;border-radius:50%;background:var(--green)}

.card{position:absolute;left:20px;bottom:20px;width:380px;max-width:calc(100% - 40px);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);z-index:3;overflow:hidden}
.card-in{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;transition:opacity .22s,transform .22s}
.card-in.swap{opacity:0;transform:translateY(6px)}
.chiprow{display:flex;align-items:center;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--green-wash);color:var(--green-ink);font-size:12px;font-weight:700}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.when{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.place{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center}
.logo{width:52px;height:52px;border-radius:var(--r);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.02em}
.logo{background:#fff;border:1px solid var(--line)}
.place h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.place p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.desc{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);align-items:start;border-top:1px solid var(--line);padding-top:12px;gap:8px}
.facts div{display:flex;flex-direction:column;gap:2px;min-width:0}
.facts span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.facts b{font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.handle{display:none}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.navrow .btn{flex-direction:column;gap:0;line-height:1.15}
.navrow .btn small{font-size:11.5px;font-weight:600;opacity:.8}
.ghost-btn{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.listv{display:flex;flex-direction:column;gap:20px}
.back{display:none;align-items:center;gap:4px;font-weight:700;font-size:15px;color:var(--green-ink);align-self:flex-start;padding:4px 6px 4px 0}
.rail.detail .listv{display:none}
.rail.detail .back{display:inline-flex}
.groups{display:flex;flex-direction:column;gap:18px}
.group{display:flex;flex-direction:column;gap:6px}
.group .label{display:flex;align-items:center;gap:8px;padding-left:2px}
.group .label span{font-family:var(--mono);font-size:11px;color:var(--ink-3);background:var(--sunk);border-radius:999px;padding:1px 7px;letter-spacing:0}
.dests{gap:2px}
.dest{grid-template-columns:40px 1fr auto;padding:10px 12px}
.dest .ico{width:40px;height:40px}
.dest .dt{min-width:0}
.dest .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.init{font-weight:800;font-size:14px;color:var(--ink-2)}
.logo .init{font-size:18px}
.pin-alt{cursor:pointer}
.pin-alt:hover circle{stroke:var(--green)}
.alt-l{fill:var(--ink-2);font:600 12px var(--f);paint-order:stroke;stroke:var(--map);stroke-width:4px}
.pin-alt.done circle{fill:var(--green);stroke:var(--surface)}
.pin-alt circle.start{stroke-width:4}
.timeline .dest{position:relative}
.timeline .dest:not(:last-child)::after{content:"";position:absolute;left:31px;top:50%;height:calc(100% + 8px);width:2px;background:var(--line);transition:background .4s}
.timeline .dest .ico{position:relative;z-index:1}
.timeline .dest.passed:not(:last-child)::after{background:var(--green)}
.dests.timeline{gap:8px}
#lab-r{display:flex;align-items:center}
#lab-r span{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);background:var(--sunk);border-radius:999px;padding:2px 8px;letter-spacing:0;text-transform:none}
.card{max-height:calc(100% - 92px);overflow:auto}
.sec{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.hl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.hl li{position:relative;padding-left:18px;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.hl li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.stops{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.stops li{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;position:relative;padding-bottom:14px}
.stops li:last-child{padding-bottom:0}
.stops li:not(:last-child)::after{content:"";position:absolute;left:9px;top:14px;bottom:-2px;width:2px;background:var(--line)}
.stops i{width:10px;height:10px;margin:4px 0 0 5px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-3);position:relative;z-index:1}
.stops li.now i{border-color:var(--dest);background:var(--dest)}
.stops b{display:block;font-size:14px;font-weight:700}
.stops span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.stops em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stops li.now em{color:var(--ink)}

/* ---------- mobile ---------- */
@container app (max-width:820px){
  .app{display:block;position:relative}
  .map{position:absolute;inset:0}
  .card{display:none}
  .legend{top:calc(16px + env(safe-area-inset-top,0px));left:16px}
  .controls{top:calc(16px + env(safe-area-inset-top,0px));right:16px}
  .rail{position:absolute;left:0;right:0;bottom:0;border-right:0;border-radius:20px 20px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.14);
        height:min(86%,640px);transform:translateY(var(--sheet-y,calc(100% - 360px)));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .handle{touch-action:none}
  .sheet-body{touch-action:pan-y;overscroll-behavior:contain}
  .rail.dragging{transition:none}
  .handle{display:flex;justify-content:center;padding:10px 0 2px;cursor:grab;width:100%}
  .handle span{width:40px;height:5px;border-radius:3px;background:var(--line)}
  .top{display:none}
  .sheet-body{padding:6px 16px 16px;gap:16px}
  .greet h1{font-size:24px}
  .rail.detail .mcard{display:flex}
  .listv{gap:16px}
  .cta{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
}
.mcard{display:none;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.mcard .desc{font-size:14px}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* live site: no preview toggle, layout follows the visitor's screen */
.bar{display:none}
.stage{grid-template-rows:minmax(0,1fr)}
</style>
</head>
<body>


<div class="stage" id="stage">
<div class="bar"><div class="seg" role="group" aria-label="Preview mode">
  <button id="mWeb" aria-pressed="true">Web</button><button id="mApp" aria-pressed="false">App</button>
</div></div>
<div class="holder"><div class="frame" id="frame">
<div class="app">
  <aside class="rail" id="rail" aria-label="Destinations">
    <button class="handle" id="handle" aria-label="Expand or collapse panel"><span></span></button>
    <div class="top">
      <div class="brand"><i></i>ghifari</div>
      <div class="avatar" aria-hidden="true">G</div>
    </div>
    <div class="sheet-body" id="sheetBody">
      <div class="listv">
      <div class="greet">
        <small>Hi, I'm Ghifariyadi</small>
        <h1>Where to?</h1>
      </div>

      <div class="trip" aria-hidden="true">
        <div class="rail-ico"><span class="dot"></span><span class="stem"></span><span class="sq"></span></div>
        <div class="row"><span class="val">Ghifariyadi</span><em>Pickup</em></div>
        <div class="row"><span class="val" id="tripTo">UC Berkeley</span><em id="tripToYr">2026–27</em></div>
      </div>

      <div id="dests" class="groups"></div>

      </div>
      <button class="back" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>My route</button>
      <div class="mcard" id="mcard"></div>
    </div>
    <div class="cta">
      <div class="navrow"><button class="btn ghost-btn" id="prevBtn">‹ Previous</button><button class="btn" id="nextBtn">Next ›</button></div>
      <div class="fine">Schematic map · not to scale</div>
    </div>
  </aside>

  <main class="map" aria-label="Route map">
    <svg id="svg" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Schematic route map">
      <g id="base"></g>
      <path id="ghost" class="ghost"/>
      <path id="casing" class="route-casing"/>
      <path id="route" class="route"/>
      <g id="pins"></g>
      <circle id="car" class="car" r="8" cx="-50" cy="-50"/>
    </svg>
    <div class="legend"><b></b><span id="legendTxt">Route to UC Berkeley</span></div>
    <div class="controls">
      <div class="ctrl-group">
        <button class="ctrl" id="zin" aria-label="Zoom in"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="ctrl" id="zout" aria-label="Zoom out"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      </div>
      <button class="ctrl ctrl-solo" id="recenter" aria-label="Recenter on route"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="ctrl ctrl-solo" id="theme" aria-label="Toggle light or dark map"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3a9 9 0 100 18V3z" fill="currentColor"/><circle cx="12" cy="12" r="9"/></svg></button>
    </div>
    <section class="card" aria-live="polite"><div class="card-in" id="card"></div></section>
  </main>
</div>
</div></div>
</div>

<script>

function tag(x,y,title,sub,eta){
  const g=el("g",{class:"tag",transform:`translate(${x},${y})`});
  const w=Math.max(title.length*7.8,sub.length*6.2)+(eta?64:24);
  el("rect",{x:0,y:-22,width:w,height:44,rx:10},g);
  if(eta){el("rect",{class:"eta",x:6,y:-16,width:44,height:32,rx:7},g);const t=el("text",{class:"eta-t",x:28,y:4,"text-anchor":"middle"},g);t.textContent=eta}
  const ox=eta?60:12;
  el("text",{x:ox,y:-3},g).textContent=title;
  el("text",{x:ox,y:13,class:"sub"},g).textContent=sub;
  return {g,w};
}
function drawPins(k){
  pins.innerHTML="";const d=byId[k],ix=P.indexOf(d);
  P.forEach((p,i)=>{
    if(i===ix)return;
    const g=el("g",{class:"pin-alt"+(i<ix?" done":"")},pins);
    if(i===0){el("circle",{class:"start",cx:p.pin[0],cy:p.pin[1],r:10},g)}
    else el("circle",{cx:p.pin[0],cy:p.pin[1],r:7},g);
    el("text",{x:p.pin[0],y:p.pin[1]+26,class:"alt-l","text-anchor":"middle"},g).textContent=p.name;
    g.addEventListener("click",()=>{select(p.id);showDetail(true)});
  });
  const dg=el("g",{class:"pin-d"},pins);el("rect",{class:"outer",x:d.pin[0]-13,y:d.pin[1]-13,width:26,height:26,rx:13},dg);el("rect",{class:"inner",x:d.pin[0]-4,y:d.pin[1]-4,width:8,height:8,rx:4},dg);
  const t=tag(0,0,d.name,`Stop ${ix+1} of ${P.length}`,d.yr.slice(-2).padStart(3,"'"));
  const tx=d.pin[0]>600?d.pin[0]-t.w-24:d.pin[0]+24;
  t.g.setAttribute("transform",`translate(${tx},${d.pin[1]-42})`);pins.appendChild(t.g);
}
/* camera */
const svg=$("svg");let vb=[0,0,1000,800],anim;
const RM=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
function setVB(t,ms=700){
  cancelAnimationFrame(anim);const f=[...vb],s=performance.now();
  if(RM()){vb=t;svg.setAttribute("viewBox",t.join(" "));return}
  const step=n=>{let p=Math.min(1,(n-s)/ms);p=1-Math.pow(1-p,3);vb=f.map((v,i)=>v+(t[i]-v)*p);svg.setAttribute("viewBox",vb.join(" "));if(p<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}
function fitBox(b){
  const mobile=isMob(),W=svg.clientWidth,H=svg.clientHeight,m=mobile?40:70;
  const Lp=mobile||W-440<380?0:440,T=mobile?70:80,B=mobile?380:40;
  const aw=Math.max(80,W-Lp-2*m),ah=Math.max(80,H-T-B);
  const sc=Math.min(aw/b.width,ah/b.height);
  setVB([b.x-(Lp+m)/sc-(aw/sc-b.width)/2, b.y-T/sc-(ah/sc-b.height)/2, W/sc, H/sc],900);
}
function fit(){fitBox(ghost.getBBox())}
function focus(k){
  const i=P.indexOf(byId[k]),pts=[P[i-1],P[i],P[i+1]].filter(Boolean).map(p=>p.pin);
  let x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0])),y0=Math.min(...pts.map(p=>p[1])),y1=Math.max(...pts.map(p=>p[1]));
  const cx=(x0+x1)/2,cy=(y0+y1)/2,w=Math.max(x1-x0,isMob()?420:640),h=Math.max(y1-y0,isMob()?320:480);
  fitBox({x:cx-w/2,y:cy-h/2,width:w,height:h});
}
function zoom(f){const[x,y,w,h]=vb,nw=w*f,nh=h*f;setVB([x+(w-nw)/2,y+(h-nh)/2,nw,nh],300)}

/* route */
let carRaf;
const pathOf=a=>"M"+a.map(p=>p.pin.join(" ")).join(" L");
$("ghost").setAttribute("d",pathOf(P));
const ghost=$("ghost"),route=$("route"),casing=$("casing"),car=$("car");
[route,casing].forEach(p=>p.setAttribute("d",pathOf(P)));
const TOT=ghost.getTotalLength();
const stopD=(()=>{let d=0;return P.map((p,i)=>{if(i)d+=Math.hypot(p.pin[0]-P[i-1].pin[0],p.pin[1]-P[i-1].pin[1]);return d})})();
let drawn=0;
function setDrawn(d){drawn=d;[route,casing].forEach(p=>{p.style.strokeDasharray=`${Math.max(d,0.01)} ${TOT+10}`});
  const pt=ghost.getPointAtLength(d);car.setAttribute("cx",pt.x);car.setAttribute("cy",pt.y)}
function drawRoute(k){
  const to=stopD[P.indexOf(byId[k])],from=drawn;cancelAnimationFrame(carRaf);
  if(RM()||from===to){setDrawn(to);return}
  const ms=Math.min(1400,500+Math.abs(to-from)*1.1),s=performance.now();
  const loop=n=>{const p=Math.min(1,(n-s)/ms),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;setDrawn(from+(to-from)*e);if(p<1)carRaf=requestAnimationFrame(loop)};
  carRaf=requestAnimationFrame(loop);
}
/* card */
const cardHTML=d=>`
  <div class="chiprow"><span class="chip"><i></i>${d.chip}</span><span class="when">${d.when}</span></div>
  <div class="place"><div class="logo">${mark(d)}</div><div><h2>${d.title}</h2><p>${d.sub}</p></div></div>
  ${d.desc?`<p class="desc">${d.desc}</p>`:""}
  <div class="facts">${d.facts.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join("")}</div>
  ${d.hl?`<div class="sec"><div class="label">Highlights</div><ul class="hl">${d.hl.map(h=>`<li>${h}</li>`).join("")}</ul></div>`:""}`;

let cur=null;
function select(k){
  if(k===cur)return;const first=!cur;cur=k;const d=byId[k];
  document.querySelectorAll(".dest").forEach(b=>b.setAttribute("aria-checked",b.dataset.k===k));
  $("tripTo").textContent=d.name;$("tripToYr").textContent=d.yr;
  $("legendTxt").textContent="Route to "+d.name;
  const ix=P.indexOf(d),pv=P[ix-1],nx=P[ix+1];
  $("prevBtn").disabled=!pv;$("nextBtn").disabled=!nx;
  $("prevBtn").innerHTML=`‹ Previous<small>${pv?pv.name:"Start of route"}</small>`;
  $("nextBtn").innerHTML=`Next ›<small>${nx?nx.name:"Current stop"}</small>`;
  const c=$("card");c.classList.add("swap");
  setTimeout(()=>{c.innerHTML=cardHTML(d);$("mcard").innerHTML=cardHTML(d);c.parentElement.scrollTop=0;document.querySelectorAll(".dest").forEach(b=>b.classList.toggle("passed",P.indexOf(byId[b.dataset.k])<=P.indexOf(d)));c.classList.remove("swap")},first?0:180);
  drawRoute(k);drawPins(k);focus(k);
}
function showDetail(on){rail.classList.toggle("detail",on&&isMob());$("sheetBody").scrollTop=0;if(on)openSheet()}
document.querySelectorAll(".dest").forEach(b=>b.addEventListener("click",()=>{select(b.dataset.k);showDetail(true)}));
$("back").onclick=()=>showDetail(false);
const step=n=>{const i=P.findIndex(p=>p.id===cur)+n;if(P[i]){select(P[i].id);$("sheetBody").scrollTop=0}};
$("prevBtn").onclick=()=>step(-1);$("nextBtn").onclick=()=>step(1);
$("zin").onclick=()=>zoom(.75);$("zout").onclick=()=>zoom(1.33);$("recenter").onclick=fit;$("recenter").setAttribute("aria-label","Show whole route");
$("theme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};


const collapsedY=()=>rail.offsetHeight-360;
function setSheet(o){open=o;rail.style.setProperty("--sheet-y",o?"0px":collapsedY()+"px")}
function openSheet(){if(isMob()&&!open)setSheet(true)}
$("handle").onclick=()=>setSheet(!open);
let sy=null,b0=0,moved=false;
rail.addEventListener("pointerdown",e=>{if(!isMob()||e.target.closest(".dest,.btn,.sheet-body"))return;sy=e.clientY;b0=open?0:collapsedY();moved=false;rail.classList.add("dragging")});
addEventListener("pointermove",e=>{if(sy==null)return;const dy=e.clientY-sy;if(Math.abs(dy)>4)moved=true;rail.style.setProperty("--sheet-y",Math.max(0,Math.min(collapsedY(),b0+dy))+"px")});
addEventListener("pointerup",e=>{if(sy==null)return;rail.classList.remove("dragging");const dy=e.clientY-sy;sy=null;if(moved)setSheet(Math.abs(dy)>60?dy<0:open)});
const relayout=()=>{if(isMob())setSheet(open);else{rail.classList.remove("detail");rail.style.removeProperty("--sheet-y")}cur&&focus(cur)};
addEventListener("resize",relayout);
function mode(app){$("stage").classList.toggle("appmode",app);$("mWeb").setAttribute("aria-pressed",!app);$("mApp").setAttribute("aria-pressed",app);open=false;setTimeout(relayout,380)}
$("mWeb").onclick=()=>mode(false);$("mApp").onclick=()=>mode(true);

if(isMob())setSheet(false);
select("ucb");
})();

</script>
